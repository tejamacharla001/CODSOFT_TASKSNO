<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expense Tracker | Task 3</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;background:#f3f6fb;margin:0;padding:25px 14px;color:#172033}.box{max-width:760px;margin:25px auto;background:white;padding:26px;border-radius:15px;box-shadow:0 8px 25px #17203314}h1{text-align:center}.sub{text-align:center;color:#687386}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}.summary div{background:#f1f5ff;padding:15px;text-align:center;border-radius:9px}.summary strong{display:block;font-size:20px;margin-top:8px}form{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;margin:20px 0}input,select{padding:11px;border:1px solid #ccd3df;border-radius:8px;min-width:0}button{border:0;border-radius:8px;padding:11px 15px;background:#2563eb;color:white;cursor:pointer}ul{list-style:none;padding:0}li{display:flex;gap:10px;padding:12px 3px;border-bottom:1px solid #edf0f5}li span{flex:1}.income{color:#16803c}.expense{color:#d12f42}.del{background:#dc3545}.back{display:block;text-align:center;margin-top:22px;color:#2563eb;text-decoration:none}@media(max-width:620px){form{grid-template-columns:1fr 1fr}.summary{grid-template-columns:1fr}}
</style></head><body><main class="box"><h1>Expense Tracker</h1><p class="sub">CodSoft Internship · Task 3</p>
<section class="summary"><div>Balance<strong id="balance">₹0.00</strong></div><div>Income<strong id="income">₹0.00</strong></div><div>Expenses<strong id="expenses">₹0.00</strong></div></section>
<form id="form"><input id="desc" placeholder="Description" required><input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount" required><select id="type"><option value="income">Income</option><option value="expense">Expense</option></select><button>Add</button></form>
<h2>Transaction History</h2><ul id="history"></ul><a class="back" href="../tasks.html">← Back to all tasks</a></main>
<script>
const form=document.getElementById('form'),desc=document.getElementById('desc'),amount=document.getElementById('amount'),type=document.getElementById('type'),history=document.getElementById('history');let data=JSON.parse(localStorage.getItem('tejaExpenses')||'[]');const money=n=>'₹'+n.toFixed(2);
function render(){let inc=0,exp=0;history.innerHTML='';data.forEach((x,i)=>{if(x.type==='income')inc+=x.amount;else exp+=x.amount;let li=document.createElement('li'),s=document.createElement('span'),b=document.createElement('button');s.textContent=x.description+' — '+(x.type==='income'?'+':'−')+money(x.amount);s.className=x.type;b.textContent='Delete';b.className='del';b.onclick=()=>{data.splice(i,1);save()};li.append(s,b);history.append(li)});document.getElementById('income').textContent=money(inc);document.getElementById('expenses').textContent=money(exp);document.getElementById('balance').textContent=money(inc-exp)}
function save(){localStorage.setItem('tejaExpenses',JSON.stringify(data));render()}
form.onsubmit=e=>{e.preventDefault();let n=Number(amount.value),d=desc.value.trim();if(d&&n>0){data.push({description:d,amount:n,type:type.value});desc.value='';amount.value='';save()}};render();
</script></body></html>
